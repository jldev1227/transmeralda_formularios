# Project-wide Gradle settings.

# JVM settings for Gradle daemon
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Enable AndroidX
android.useAndroidX=true

# Enable AAPT2 PNG crunching
android.enablePngCrunchInReleaseBuilds=true

# Architectures for React Native builds
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Disable new architecture for compatibility
newArchEnabled=false

# Enable Hermes engine for React Native
hermesEnabled=true

# GIF and WebP support (adjust based on your needs)
expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false

# Network inspector (disable if not debugging network)
EX_DEV_CLIENT_NETWORK_INSPECTOR=false

# Use legacy packaging for native libraries if needed
expo.useLegacyPackaging=true
